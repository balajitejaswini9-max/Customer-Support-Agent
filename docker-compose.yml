      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.25}
    profiles: ["eval-p3"]

  # Phase 3 live HTTP evals — runs against the agent service
  eval-p3-live:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase3.py", "-v"]
    environment:
