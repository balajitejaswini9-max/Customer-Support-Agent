services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KB_DIR=knowledge_base
      - CHROMA_DIR=/data/chroma
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.25}
    volumes:
      - chroma_data:/data/chroma
    restart: unless-stopped

  # Unit tests — no API key required
  test:
    build: .
    command: ["python", "-m", "pytest", "tests/test_ingestion.py", "tests/test_retrieval.py", "-v"]
    profiles: ["test"]

  # Full behavioural eval — requires ANTHROPIC_API_KEY
  eval:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase1.py", "-v"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.25}
    profiles: ["eval"]

volumes:
  chroma_data:
