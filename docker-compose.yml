services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KB_DIR=knowledge_base
      - CHROMA_DIR=/data/chroma
      - DATA_DIR=/data/db
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.25}
    volumes:
      - agent_data:/data
    restart: unless-stopped

  # Unit tests — no API key required
  test:
    build: .
    command: ["python", "-m", "pytest", "tests/test_ingestion.py", "tests/test_retrieval.py", "-v"]
    profiles: ["test"]

  # Phase 1 structural evals — no API key required
  eval-p1-struct:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase1.py", "-m", "not api and not live", "-v"]
    profiles: ["eval-p1"]

  # Phase 1 behavioural eval — requires ANTHROPIC_API_KEY
  eval:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase1.py", "-v"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.25}
    profiles: ["eval", "eval-p1"]

  # Phase 2 structural evals — no server required (HTML/CSS/JS checks only)
  eval-p2-struct:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase2.py", "-m", "not live", "-v"]
    profiles: ["eval-p2"]

  # Phase 2 live API evals — runs against the agent service
  eval-p2-live:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase2.py", "-v"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BASE_URL=http://agent:8000
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.25}
    depends_on:
      - agent
    profiles: ["eval-p2"]

  # Phase 3 structural evals — no server or API key required
  eval-p3-struct:
    build: .
    command: ["python", "-m", "pytest", "tests/eval_phase3.py", "-m", "not api and not live", "-v"]
    profiles: ["eval-p3"]

  # Phase 3 agent behaviour evals — requires ANTHROPIC_API_KEY (no server)
  eval-p3-agent:
