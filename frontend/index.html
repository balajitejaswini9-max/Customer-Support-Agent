<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="chat-container" role="main">
    <header class="chat-header">
      <h1>Customer Support</h1>
    </header>

    <section
      id="message-list"
      class="message-list"
      role="log"
      aria-live="polite"
      aria-label="Conversation"
    ></section>

    <div
      id="error-banner"
      class="error-banner"
      role="alert"
      aria-live="assertive"
      hidden
    >
      <p id="error-text">An error occurred. Please try again.</p>
    </div>

    <form id="chat-form" class="chat-form" novalidate>
      <label for="message-input" class="visually-hidden">
        Type your support question
      </label>
      <textarea
        id="message-input"
        name="message"
        class="message-input"
        placeholder="Type your question…"
        rows="2"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="submit-button" class="submit-button">
        Send
      </button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
